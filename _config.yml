title: Paul Griffiths | Projects
description: A portfolio of data, Tableau and real-world projects.

# The label used for the home page in the menu and the "Back" link.
# Change this one word to rename that page everywhere.
home_label: Projects

# Leave baseurl empty if this repo is named <your-username>.github.io
baseurl: ""

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

exclude:
  - README.md
  - .gitignore
